name: Release

on:
  push:
    tags: ["v*"]

# `checks: write` 是给 rustsec/audit-check 用的：它要把审计结果写成一条 check run
# （只给 contents: write 时会在 macOS/Windows 上报 "Resource not accessible by integration"）。
permissions:
  contents: write
  checks: write

jobs:
  build-windows:
    name: 构建 Windows 安装包并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 启用 pnpm
        uses: pnpm/action-setup@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 校验发布标签与四处版本一致
        shell: pwsh
        run: node scripts/check-version.mjs "$env:GITHUB_REF_NAME"

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 质量门禁
        run: pnpm check

      # 发布阻断级：依赖里有已知漏洞（Rust 全量 / JS 高危及以上）就不出包
      - name: Rust 依赖审计（cargo audit）
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: JS/TS 依赖审计（pnpm audit，高危及以上即失败）
        run: pnpm audit --audit-level=high

      - name: 构建安装包（NSIS + MSI）
        run: pnpm tauri:build

      # 真实应用 smoke（`pnpm test:e2e:app:smoke`）**不在这里跑**：它要 WebView2 远程调试，
      # 而 GitHub 托管的 Windows runner 起不了带窗口的 WebView2（CDP 端口一直不开，
      # 实测整步 30s 超时）。它是**本地发布前的手动门禁**（命令与用法见 README 质量门禁表）。

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: Mimenote ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
