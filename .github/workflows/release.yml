name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 安装包并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 启用 pnpm
        uses: pnpm/action-setup@v6

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 校验发布标签与四处版本一致
        shell: pwsh
        run: node scripts/check-version.mjs "$env:GITHUB_REF_NAME"

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 质量门禁
        run: pnpm check

      # 发布阻断级：依赖里有已知漏洞（Rust 全量 / JS 高危及以上）就不出包
      - name: Rust 依赖审计（cargo audit）
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: JS/TS 依赖审计（pnpm audit，高危及以上即失败）
        run: pnpm audit --audit-level=high

      - name: 构建安装包（NSIS + MSI）
        run: pnpm tauri:build

      # 直接对刚出炉的 release 二进制跑 smoke（复用同一次构建，不重复编译）：
      # 打开 Vault / 打开笔记 / 编辑保存（真实磁盘）/ 搜索 / 链接导航。
      # 任一步失败即阻断发布。
      - name: 真实应用 smoke E2E（Release 阻断级）
        run: pnpm test:e2e:app:smoke

      - name: 上传失败产物（截图）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-app-smoke-artifacts
          path: apps/desktop/e2e-artifacts/
          if-no-files-found: ignore

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mimenote ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
