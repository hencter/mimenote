name: Release

# 版本发布遵循语义化版本 2.0.0（https://semver.org/lang/zh-CN/）：
# 打 `vX.Y.Z` 标签即发布；标签版本必须与 tauri.conf.json / package.json 完全一致，
# 且已发行的版本内容禁止改变 —— 任何修改都必须以新版本发行。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    name: 构建 Windows 安装包并发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验标签是合法 semver 且与代码中的版本一致
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-((0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?$') {
            Write-Error "标签 $tag 不是合法的语义化版本（期望 vX.Y.Z）"; exit 1
          }
          $tagVersion = $tag.Substring(1)
          $conf = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($conf.version -ne $tagVersion -or $pkg.version -ne $tagVersion) {
            Write-Error "版本不一致：标签 $tagVersion / tauri.conf.json $($conf.version) / package.json $($pkg.version)"
            exit 1
          }
          Write-Host "版本校验通过：$tag"

      - name: 启用 pnpm
        uses: pnpm/action-setup@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo 缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 质量门禁
        run: pnpm check

      - name: 构建安装包（NSIS + MSI）
        run: pnpm tauri:build

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Mimenote ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
