[workspace]
resolver = "2"
members = ["crates/mn-core", "crates/mn-index", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
authors = ["mimenote contributors"]
repository = "https://example.invalid/mimenote"

[workspace.dependencies]
mn-core = { path = "crates/mn-core" }
mn-index = { path = "crates/mn-index" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
log = "0.4"
env_logger = "0.11"
# 文件监听（ADR-0016）：**只给宿主 crate**用 —— `mn-core`/`mn-index` 是纯库，
# 监听是"会话级的外部世界信号"，属于宿主职责，不能污染可重建的索引层。
notify = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[profile.dev]
# 依赖用 O3 编译，应用自身保持默认，兼顾开发期链接速度与运行性能。
opt-level = 0

[profile.dev.package."*"]
opt-level = 3
